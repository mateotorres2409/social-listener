[project]
name = "social-listener"
version = "0.1.0"
description = "Plataforma de social listening para entidades financieras con exportación enriquecida vía OpenTelemetry"
authors = [
    { name = "Mateo Torres Arredondo", email = "mateotorres2409@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.15.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.150.0",
    "httpx>=0.28.1",
    "openai>=3.35.1",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
social-listener = "social_listener.bootstrap.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "openapi-spec-validator>=0.9.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.1",
    "testcontainers[postgres]>=4.15.0",
]

[tool.importlinter]
root_package = "social_listener"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Capas de Clean Architecture: bootstrap -> adapters -> application -> domain"
type = "layers"
layers = [
    "social_listener.bootstrap",
    "social_listener.adapters",
    "social_listener.application",
    "social_listener.domain",
]

[[tool.importlinter.contracts]]
name = "domain no depende de frameworks ni de infraestructura"
type = "forbidden"
source_modules = ["social_listener.domain"]
forbidden_modules = [
    "fastapi", "starlette", "uvicorn", "pydantic", "pydantic_settings",
    "sqlalchemy", "alembic", "asyncpg", "httpx", "opentelemetry",
    "anthropic", "openai",
]

[[tool.importlinter.contracts]]
name = "application no depende de frameworks ni de infraestructura"
type = "forbidden"
source_modules = ["social_listener.application"]
forbidden_modules = [
    "fastapi", "starlette", "uvicorn", "pydantic", "pydantic_settings",
    "sqlalchemy", "alembic", "asyncpg", "httpx", "opentelemetry",
    "anthropic", "openai",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "stubs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "ASYNC", "RUF", "SIM", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]  # el código y los textos están en español

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests/fakes", "tests/contracts"]
explicit_package_bases = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["social_listener.domain.*", "social_listener.application.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requiere Docker (testcontainers)",
    "ollama: requiere un servidor Ollama real",
    "e2e: requiere el entorno de Docker Compose",
]
addopts = "-ra --strict-markers"
